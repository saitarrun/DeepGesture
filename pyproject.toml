[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "deepgesture"
version = "0.1.0"
description = "Industrial-grade macOS gesture control engine using MediaPipe and deep learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sai Tarrun Pitta", email = "saitarrunpitta@gmail.com" }]
keywords = ["gesture-recognition", "computer-vision", "macos", "mediapipe", "deep-learning", "hci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
dependencies = [
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.9",
    "pyautogui>=0.9.54",
    "numpy>=1.24.0",
    "rumps>=0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4.4"]

[project.scripts]
deepgesture = "virtual_mouse:main"

[project.urls]
Repository = "https://github.com/saitarrun/DeepGesture"
Issues = "https://github.com/saitarrun/DeepGesture/issues"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["F"]        # pyflakes: real bugs only (undefined names, unused imports, etc.)
ignore = ["F401"]     # unused imports tolerated in __init__-style modules

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["."]
omit = ["test_*", "setup.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
