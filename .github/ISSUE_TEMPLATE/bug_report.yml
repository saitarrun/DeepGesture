name: Bug Report
description: Something broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Fill out all sections. Vague reports without reproduction steps will be closed.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug. Include exact error message if any.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch with config X
        2. Perform gesture Y
        3. See error / wrong behavior
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: macos
    attributes:
      label: macOS version
      options:
        - macOS 15 Sequoia
        - macOS 14 Sonoma
        - macOS 13 Ventura
        - macOS 12 Monterey
        - Other
    validations:
      required: true

  - type: dropdown
    id: chip
    attributes:
      label: Hardware
      options:
        - Apple Silicon (M1/M2/M3/M4)
        - Intel Mac
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "e.g. 3.11.8"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      render: shell
